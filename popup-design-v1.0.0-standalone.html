:root{--blue:#0052d7;--blue-dark:#0045b5;--blue-soft:#edf3ff;--ink:#16205c;--text:#3b4177;--muted:#656d93;--line:#e1e6f2;--line-strong:#cbd3e6;--surface:#fff;--page:#f6f8fd;--soft:#eef1f8;--green:#168046;--green-soft:#dcfce7;--amber:#8b5307;--amber-soft:#fff5d3;--danger:#c33535;--danger-soft:#fff1f1;--radius:12px;--sidebar:248px;--shadow:0 12px 40px #16205c1c}
*{box-sizing:border-box}html{scroll-padding-top:85px}body{margin:0;background:var(--page);color:var(--text);font:13px/1.55 Lexend,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--blue);text-underline-offset:3px}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{color:inherit}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #729bec;outline-offset:3px}input,textarea{caret-color:var(--blue)}::selection{background:#cddfff;color:var(--ink)}h1,h2,h3,h4,p{margin:0}h1,h2,h3{color:var(--ink)}h1,h2{font-family:'Plus Jakarta Sans',Lexend,sans-serif;letter-spacing:-.025em}h2{font-size:22px;line-height:1.4;font-weight:800}h3{font-size:14px;font-weight:600}small{font-size:11px}strong{font-weight:600}svg{display:inline-block}.icon{width:18px;height:18px;flex-shrink:0;vertical-align:middle}.hidden,[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link{position:fixed;left:15px;top:-80px;z-index:100;background:white;padding:12px}.skip-link:focus{top:12px}.muted{color:var(--muted)}

Popup.Editor = (() => {
  const S=Popup.State,U=Popup.UI;
  let form=null, original='', version=0, mode='now', errors={}, failure='', busy=false;
  const blank=()=>({id:'',image:'',imageName:'',alt:'',tag:'',category:'',title:'',description:'',cta:'',url:'',publishAt:'',unpublishAt:'',status:'draft',activated:false});
  function open(id, schedule=false){
    const item=S.data.items.find(x=>x.id===id);
    form=item?structuredClone(item):blank();version=item?.version||0;original=JSON.stringify(form);errors={};failure='';busy=false;
    mode=schedule||form.publishAt&&S.time(form.publishAt)>S.now()?'schedule':'now';render();

  const dirty=()=>form && JSON.stringify(form)!==original;
  function field(key,label,{required=false,textarea=false,placeholder='',help=''}={}){return `<div class="field" data-field-wrap="${key}"><label for="field-${key}">${label}${required?'<span class="required">*</span>':'<span class="optional">Tùy chọn</span>'}</label>${textarea?`<textarea id="field-${key}" name="${key}" rows="3" placeholder="${U.esc(placeholder)}" aria-describedby="error-${key} ${key}-help">${U.esc(form[key])}</textarea>`:`<input id="field-${key}" name="${key}" value="${U.esc(form[key])}" placeholder="${U.esc(placeholder)}" aria-describedby="error-${key} ${key}-help" ${key==='url'?'spellcheck="false"':''}>`}<div class="field-meta"><small id="${key}-help">${help}</small>${key==='url'?`<small id="url-count">${form.url.length}/500</small>`:''}</div><p class="field-error" id="error-${key}" hidden></p></div>`;}
  function render(){

      <div class="editor-grid"><form id="popup-form" novalidate><div id="editor-alert" role="alert"></div>

          <div class="field" data-field-wrap="image"><label>Ảnh chính <span class="required">*</span></label><div class="image-field"><button type="button" class="image-select ${form.image?'has-image':''}" data-action="choose-image" aria-label="${form.image?'Thay':'Chọn'} ảnh chính">${form.image?`<img src="${U.esc(form.image)}" alt="${U.esc(form.alt)}">`:`${U.icon('image')}<strong>Chọn ảnh</strong><small>Từ thư viện hoặc thiết bị</small>`}</button><div class="image-guidance"><strong>Khung ảnh 3:2</strong><p>Tham chiếu 1200 × 800 px.<br>Ảnh khác tỷ lệ được cắt phủ, không kéo méo.</p>${form.image?`<small class="filename">${U.esc(form.imageName||'Ảnh đã chọn')}</small>${U.button('Thay ảnh','choose-image',{icon:'image',class:'small-btn'})}${U.button('Gỡ ảnh','remove-image',{class:'text-btn small-btn'})}`:''}</div></div><p class="field-error" id="error-image" hidden></p></div>
          ${field('alt','Mô tả ảnh',{placeholder:'Mô tả ngắn nội dung ảnh',help:'Giúp người dùng trình đọc màn hình hiểu nội dung ảnh.'})}
        </section>
        <section class="form-section"><div class="section-heading"><h3>Nội dung Popup</h3></div><div class="two-fields">${field('tag','Nhãn nổi',{placeholder:'Ví dụ: Chăm sóc sức khỏe'})}${field('category','Nhóm nội dung',{placeholder:'Ví dụ: Dịch vụ y tế'})}</div>${field('title','Tiêu đề',{required:true,placeholder:'Nhập tiêu đề Popup'})}${field('description','Mô tả phụ',{textarea:true,placeholder:'Bổ sung thông tin để người xem hiểu rõ nội dung'})}</section>
        <section class="form-section"><div class="section-heading"><h3>Nút hành động</h3></div>${field('cta','Nhãn nút CTA',{required:true,placeholder:'Ví dụ: Đặt lịch khám'})}${field('url','Đường dẫn CTA',{required:true,placeholder:'/dat-lich?utm_source=popup',help:'Chỉ đường dẫn nội bộ bắt đầu bằng /. Cho phép ?tham-so và #diem-neo; mở cùng tab.'})}</section>
        <section class="form-section"><div class="section-heading"><h3>Lịch xuất bản</h3>${U.icon('calendar')}</div><div class="publish-options"><label class="radio-option ${mode==='now'?'checked':''}"><input type="radio" name="publishMode" value="now" ${mode==='now'?'checked':''}><span><strong>Xuất bản ngay</strong><small>Có hiệu lực khi bấm Xuất bản</small></span></label><label class="radio-option ${mode==='schedule'?'checked':''}"><input type="radio" name="publishMode" value="schedule" ${mode==='schedule'?'checked':''}><span><strong>Hẹn lịch</strong><small>Tự bật vào thời điểm đã chọn</small></span></label></div>
          <div class="two-fields date-fields"><div class="field ${mode==='now'?'hidden':''}" id="start-field"><label for="field-publishAt">Thời điểm bắt đầu</label><input type="datetime-local" id="field-publishAt" name="publishAt" value="${U.esc(form.publishAt)}" aria-describedby="error-publishAt"><p class="field-error" id="error-publishAt" hidden></p></div><div class="field"><label for="field-unpublishAt">Thời điểm gỡ <span class="optional">Tùy chọn</span></label><input type="datetime-local" id="field-unpublishAt" name="unpublishAt" value="${U.esc(form.unpublishAt)}" aria-describedby="error-unpublishAt"><p class="field-error" id="error-unpublishAt" hidden></p></div></div><p class="field-help">Giờ Việt Nam (UTC+7). Để trống thời điểm gỡ nếu chưa xác định ngày kết thúc.</p>

          ${existing?`<div class="notice subtle">${U.icon('info')}<p>Sửa hoặc xuất bản lại vẫn giữ mã <strong>${form.id}</strong>. Người đã đóng Popup này sẽ không thấy lại. Muốn tiếp cận lại họ, hãy tạo Popup mới.</p></div>`:''}
        </section>
      </form>
      <aside class="preview-column"><div class="preview-sticky"><div class="preview-heading"><h3>Xem trước</h3>${U.button('Mở rộng','preview-form',{icon:'external',class:'text-btn small-btn'})}</div><div class="preview-canvas"><div class="preview-browser"><span></span><span></span><span></span><p>hiuh.vn /</p></div><div id="live-preview" class="mini-preview" inert aria-hidden="true">${U.popupMarkup(form,true)}</div></div><div class="preview-context">${U.icon('monitor')}<span>Trang chủ · Máy tính & máy tính bảng lớn</span></div><div class="preview-rules"><p>${U.icon('clock')}Xuất hiện sau 1 giây khi trang tải xong</p><p>${U.icon('phone')}Không hiển thị trên khung nhìn di động</p><p>${U.icon('shield')}Ghi nhớ khi người xem đóng Popup</p></div><p class="preview-caption">Bản xem trước nội dung. Nút đóng và “Để sau” là thành phần cố định của Website.</p></div></aside></div>
      <div class="editor-actions"><span id="save-status">${existing?'Mã Popup được giữ nguyên':'Chưa lưu'}<small>${published?'Lưu thay đổi giữ trạng thái Xuất bản':'Lưu nháp không ảnh hưởng Popup đang chạy'}</small></span><div>${U.button('Hủy','leave-editor',{class:'quiet'})}${published?U.button('Chuyển về Nháp','draft-editor',{icon:'stop'}):U.button(existing?'Lưu thay đổi':'Lưu nháp','save-editor',{icon:'check'})}${published?U.button('Lưu thay đổi','save-editor',{class:'primary'}):U.button(mode==='schedule'?'Hẹn lịch xuất bản':'Xuất bản ngay','publish-editor',{class:'primary',icon:mode==='schedule'?'calendar':'external'})}</div></div>`,existing?'Chỉnh sửa Popup':'Tạo Popup',true);
    showErrors();
  }
  function input(target){if(!form)return;if(target.name==='publishMode'){mode=target.value;render();return;}if(S.fields.includes(target.name)||['publishAt','unpublishAt'].includes(target.name)){form[target.name]=target.value;delete errors[target.name];showErrors(false);updatePreview();document.querySelector('#save-status').firstChild.textContent='Có thay đổi chưa lưu';}}
  function updatePreview(){const el=document.querySelector('#live-preview');if(el)el.innerHTML=U.popupMarkup(form,true);const n=document.querySelector('#url-count');if(n){n.textContent=`${form.url.length}/500`;n.classList.toggle('over-limit',form.url.length>500);}}
  function showErrors(focus=false){
    document.querySelectorAll('.field-error').forEach(el=>{const key=el.id.replace('error-','');el.textContent=errors[key]||'';el.hidden=!errors[key];const input=document.querySelector(`#field-${key}`);if(input)input.setAttribute('aria-invalid',errors[key]?'true':'false');});
    const alert=document.querySelector('#editor-alert');if(!alert)return;
    if(failure)alert.innerHTML=`<div class="notice danger">${U.icon('warning')}<div><strong>${failure.kind==='conflict'?'Nội dung đã thay đổi':failure.kind==='permission'?'Quyền truy cập đã thay đổi':'Chưa lưu được Popup'}</strong><p>${U.esc(failure.message)}</p>${failure.kind==='conflict'?`${U.button('Đối chiếu bản hiện tại','compare',{class:'small-btn'})}`:''}</div></div>`;
    else if(Object.keys(errors).length)alert.innerHTML=`<div class="notice danger">${U.icon('warning')}<p>Kiểm tra ${Object.keys(errors).length} trường được đánh dấu bên dưới. Popup đang chạy chưa thay đổi.</p></div>`;else alert.innerHTML='';
    if(focus){const first=Object.keys(errors)[0];const el=document.querySelector(`#field-${first}`)||document.querySelector('[data-action="choose-image"]');el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});}
  }
  async function save(intent){
    if(busy)return;busy=true;failure='';
    const buttons=[...document.querySelectorAll('.editor-actions button')];buttons.forEach(b=>b.disabled=true);
    document.querySelector('#save-status').firstChild.textContent='Đang lưu…';
    await new Promise(r=>setTimeout(r,350));
    const payload=structuredClone(form);if(mode==='now' && intent!=='draft')payload.publishAt='';
    const result=S.save(payload,intent==='publish'?(mode==='schedule'?'schedule':'publish'):intent,version);busy=false;
    if(!result.ok){buttons.forEach(b=>b.disabled=false);errors=result.errors||{};failure=result.errors?'':result;showErrors(true);document.querySelector('#save-status').firstChild.textContent='Chưa lưu';return;}
    original=JSON.stringify(form);form=null;location.hash='#list';
    U.toast(result.item.status==='draft'?'Đã lưu bản nháp.':result.replaced?`Đã xuất bản. “${result.replaced}” đã chuyển về Nháp.`:!result.item.activated?'Đã hẹn lịch xuất bản.':'Đã lưu thay đổi.');
  }
  function chooseImage(){const d=document.querySelector('#media-dialog');d.innerHTML=`<div class="dialog-heading"><div><h2 id="media-title">Chọn ảnh chính</h2><p>Chọn một ảnh cho Popup</p></div><button class="icon-btn" data-action="close-dialog" aria-label="Đóng thư viện ảnh">${U.icon('close')}</button></div><div class="media-body"><div class="media-toolbar"><h3>Ảnh tham chiếu</h3><label class="btn">${U.icon('upload')}Tải ảnh từ thiết bị<input type="file" accept="image/*" id="image-upload" class="sr-only"></label></div><button class="media-item" data-action="use-sample-image"><img src="${S.image}" alt="Ảnh tham chiếu trong mini-BRD"><span><strong>cham-soc-suc-khoe.webp</strong><small>1200 × 800 px · Ảnh tham chiếu từ BRD</small></span>${U.icon('plus')}</button><p class="field-help">Ảnh được hiển thị trong khung 3:2. Ảnh khác tỷ lệ vẫn dùng được và sẽ được cắt phủ.</p><p id="upload-error" class="field-error" role="alert"></p></div><div class="dialog-footer">${U.button('Hủy','close-dialog')}</div>`;d.showModal();}
  function setImage(src,name){form.image=src;form.imageName=name;delete errors.image;document.querySelector('#media-dialog').close();render();}
  async function upload(file){if(!file)return;const el=document.querySelector('#upload-error');if(!file.type.startsWith('image/')){el.textContent='Chọn một tệp ảnh có thể hiển thị trong trình duyệt.';return;}try{const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});await new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=src;});setImage(src,file.name);}catch{el.textContent='Không đọc được ảnh. Thử chọn một tệp ảnh khác.';}}
  function removeImage(){form.image='';form.imageName='';render();}
  function leave(){if(!dirty()){form=null;location.hash='#list';return;}const d=document.querySelector('#confirm-dialog');d.innerHTML=`<div class="dialog-heading"><h2 id="confirm-title">Rời trang khi chưa lưu?</h2></div><div class="dialog-body"><p>Nội dung vừa chỉnh sửa chưa được lưu. Bạn có thể quay lại để hoàn tất.</p></div><div class="dialog-footer">${U.button('Tiếp tục chỉnh sửa','close-dialog')}${U.button('Bỏ thay đổi','discard',{class:'primary'})}</div>`;d.showModal();}
  function discard(){form=null;document.querySelector('#confirm-dialog').close();location.hash='#list';}
  function compare(){const d=document.querySelector('#confirm-dialog');const current=failure.current;d.innerHTML=`<div class="dialog-heading"><h2 id="confirm-title">Đối chiếu nội dung</h2><button class="icon-btn" data-action="close-dialog" aria-label="Đóng đối chiếu">${U.icon('close')}</button></div><div class="dialog-body"><p>Đây là dữ liệu đã lưu gần nhất. Nội dung đang nhập vẫn được giữ khi bạn đóng bảng này.</p><div class="compare-grid"><div><h3>Bản đang nhập</h3><p>${U.esc(form.title)}</p><small>${U.esc(form.url)}</small></div><div><h3>Bản hiện tại</h3><p>${U.esc(current.title)}</p><small>${U.esc(current.url)}</small></div></div></div><div class="dialog-footer">${U.button('Tiếp tục đối chiếu','close-dialog')}${U.button('Nạp bản hiện tại','reload-editor',{class:'primary'})}</div>`;d.showModal();}
  function reload(){const id=form.id;document.querySelector('#confirm-dialog').close();open(id);U.toast('Đã nạp bản hiện tại.');}
  return {open,render,input,save,chooseImage,setImage,upload,removeImage,leave,discard,compare,reload,dirty,get form(){return form},get mode(){return mode},get busy(){return busy}};
})();


Popup.Website = (()=>{
  const S=Popup.State,U=Popup.UI;
  const closedKey='hiuh-popup-design-dismissed',seenKey='hiuh-popup-design-seen';
  let generation=0,timer,selected=null,visitor=false,path='/',size='1440',status='';
  const read=(storage,key)=>{try{return JSON.parse(storage.getItem(key))||[];}catch{return [];}};
  function record(storage,key,id){try{storage.setItem(key,JSON.stringify([...new Set([...read(storage,key),id])]))}catch{/* Closing must still work if storage is blocked. */}}
  function cancel(){generation++;clearTimeout(timer);}
  function preview(form){
    selected=structuredClone(form);visitor=false;
    const d=document.querySelector('#preview-dialog');d.innerHTML=`<div class="dialog-heading"><div><h2 id="preview-title">Xem trước Popup</h2><p>Trang chủ · Máy tính · Ảnh 3:2</p></div><button class="icon-btn" data-action="close-dialog" aria-label="Đóng xem trước">${U.icon('close')}</button></div><div class="preview-stage">${U.popupMarkup(selected)}</div><div class="preview-bottom">Bản xem trước không ảnh hưởng trạng thái hoặc ghi nhớ của người xem.</div>`;d.showModal();
  }
  function render(){
    cancel();visitor=true;selected=S.active()?structuredClone(S.active()):null;
    document.querySelector('#app').innerHTML=`<div class="website-demo"><header class="website-demo-bar"><a href="#list">${U.icon('back')}Quản lý Popup</a><span>Website HIUH <small>· Mô phỏng trải nghiệm</small></span>${U.button('Kịch bản thử','review',{icon:'settings',class:'small-btn'})}</header><div class="visitor-controls"><label>Khung nhìn<select id="visitor-size"><option value="1440">Máy tính · 1440 px</option><option value="1024">Máy tính bảng lớn · 1024 px</option><option value="390">Di động · 390 px</option></select></label><label>Trang<select id="visitor-path"><option value="/">Trang chủ /</option><option value="/dich-vu">Trang dịch vụ /dich-vu</option></select></label>${U.button('Tải lại trang','visitor-reload',{icon:'refresh'})}${U.button('Phiên mới','visitor-session',{class:'quiet'})}${U.button('Người xem mới','visitor-new',{class:'quiet'})}</div><div class="visitor-status" role="status" id="visitor-status">Đang tải trang mô phỏng…</div><div class="website-frame ${size==='390'?'mobile-frame':''}" id="website-frame" style="--frame-width:${size}px"><div class="hospital-nav"><div class="hospital-brand">HIU <span>HOSPITAL</span></div><nav><span>Giới thiệu</span><span>Chuyên khoa</span><span>Dịch vụ</span><span>Tin tức</span></nav><span class="hospital-contact">Chăm sóc sức khỏe</span></div><div class="site-breadcrumb">HIU Hospital <span>›</span> ${path==='/'?'Trang chủ':U.esc(path)}</div><section class="hospital-hero"><div><h1>${path==='/'?'Cùng bạn chăm sóc sức khỏe mỗi ngày':'Thông tin dành cho bạn'}</h1><p>${path==='/'?'Tìm hiểu dịch vụ và chủ động lựa chọn lịch khám phù hợp.':`Bạn đã mở đường dẫn nội bộ ${U.esc(path)} trong cùng tab mô phỏng.`}</p><span class="site-cta">${path==='/'?'Khám phá các dịch vụ':'Nội dung trang đích minh họa'}${U.icon('chevron')}</span></div><img src="${S.image}" alt="Ảnh tham chiếu từ mini-BRD"></section><div class="site-services"><div>${U.icon('calendar')}<span>Đặt lịch khám</span></div><div>${U.icon('users')}<span>Chuyên khoa</span></div><div>${U.icon('file')}<span>Thông tin dịch vụ</span></div></div><p class="website-demo-note">Bố cục Website minh họa để kiểm tra Popup; không phải bản thiết kế thay thế Website.</p></div><dialog id="visitor-dialog" aria-label="Thông báo từ HIU Hospital"></dialog></div>`;
    document.querySelector('#visitor-size').value=size;document.querySelector('#visitor-path').value=path==='/'?'/':'/dich-vu';
    const token=generation;
    const images=[...document.querySelectorAll('#website-frame img')];
    Promise.all(images.map(im=>im.decode().catch(()=>{}))).then(()=>{
      if(token!==generation)return;setStatus('Trang đã tải xong. Đang chờ 1 giây…');
      timer=setTimeout(()=>{
        if(token!==generation)return;
        if(path!=='/'){setStatus('Không hiển thị Popup: đây không phải trang chủ.');return;}
        if(Number(size)<1024 || innerWidth<1024){setStatus('Không hiển thị Popup hoặc nền mờ trên khung nhìn chưa được hỗ trợ.');return;}
        if(!selected||!S.active()||S.active().id!==selected.id){setStatus('Không có Popup đang hoạt động.');return;}
        if(read(localStorage,closedKey).includes(selected.id)){setStatus(`Không hiển thị ${selected.id}: người xem đã đóng Popup này trước đó.`);return;}
        if(read(sessionStorage,seenKey).includes(selected.id)){setStatus(`Không hiển thị ${selected.id}: Popup đã xuất hiện trong phiên này.`);return;}
        const d=document.querySelector('#visitor-dialog');d.innerHTML=U.popupMarkup(selected);d.showModal();record(sessionStorage,seenKey,selected.id);setStatus(`Đã hiển thị ${selected.id} sau 1.000 ms. Chưa ghi vết đóng.`);
        d.addEventListener('cancel',e=>{e.preventDefault();closeVisitor();});
        d.addEventListener('click',e=>{if(e.target===d)closeVisitor();});
      },1000);
    });
  }
  function setStatus(s){status=s;const el=document.querySelector('#visitor-status');if(el)el.textContent=s;}
  function closeVisitor(){const p=document.querySelector('#preview-dialog');if(p.open){p.close();return;}const d=document.querySelector('#visitor-dialog');if(d?.open){d.close();if(selected)record(localStorage,closedKey,selected.id);setStatus(`Đã đóng ${selected?.id}. Không hiển thị lại cho người xem này, kể cả trong phiên sau.`);}}
  function cta(){
    if(document.querySelector('#preview-dialog').open){U.toast(`Đường dẫn cùng tab: ${selected.url||'Chưa nhập đường dẫn CTA'}`);return;}
    if(!visitor || !document.querySelector('#visitor-dialog')?.open)return;
    if(S.validate(selected,true).url){setStatus('Đường dẫn CTA không hợp lệ. Chưa điều hướng.');return;}
    document.querySelector('#visitor-dialog').close();path=selected.url;history.replaceState(null,'',`#website?path=${encodeURIComponent(path)}`);render();setStatus('Đã mở trang nội bộ trong cùng tab. Vết đã xem được giữ; không ghi vết đóng.');
  }
  function setSize(value){size=value;document.querySelector('#website-frame').style.setProperty('--frame-width',size+'px');document.querySelector('#website-frame').classList.toggle('mobile-frame',size==='390');setStatus('Đã đổi khung nhìn. Bấm Tải lại trang để thử điều kiện hiển thị từ đầu.');}
  function setPath(value){path=value;history.replaceState(null,'',`#website?path=${encodeURIComponent(path)}`);render();}
  function newSession(){try{sessionStorage.removeItem(seenKey);}catch{}render();}
  function newVisitor(){try{localStorage.removeItem(closedKey);sessionStorage.removeItem(seenKey);}catch{}render();}
  function enter(){const query=location.hash.split('?')[1]||'';path=new URLSearchParams(query).get('path')||'/';render();}
  return {preview,render,enter,cancel,closeVisitor,cta,setSize,setPath,newSession,newVisitor};
})();


(() => {
  const S=Popup.State,U=Popup.UI,E=Popup.Editor,W=Popup.Website;
  let pendingSchedule=false, previousHash='', restoreHash=false;
  function route(){
    const hash=location.hash||'#list';
    if(restoreHash){restoreHash=false;return;}
    if(E.dirty() && previousHash.startsWith('#edit') || E.dirty() && previousHash==='#new') {
      if(hash!==previousHash){restoreHash=true;location.hash=previousHash;E.leave();return;}
    }
    previousHash=hash;W.cancel();U.hideMenu();
    if(hash.startsWith('#website'))W.enter();
    else if(hash==='#new'){E.open();}
    else if(hash.startsWith('#edit/')){const id=decodeURIComponent(hash.split('/')[1]);if(S.data.items.some(x=>x.id===id))E.open(id,pendingSchedule);else{location.hash='#list';U.toast('Không tìm thấy Popup.',true);}pendingSchedule=false;}
    else U.list();
    window.scrollTo(0,0);
  }
  function review(){
    const d=document.querySelector('#review-dialog');
    d.innerHTML=`<div class="dialog-heading"><div><h2 id="review-title">Kịch bản thử thiết kế</h2><p>Dữ liệu minh họa. Không kết nối hoặc cập nhật CMS thật.</p></div><button class="icon-btn" data-action="close-dialog" aria-label="Đóng kịch bản thử">${U.icon('close')}</button></div><div class="review-body">
      <section><h3>Thử các luồng chính</h3><p>Tạo nháp → xem trước → xuất bản ngay hoặc hẹn lịch. Dùng dấu ba chấm trên từng dòng để chuyển về Nháp.</p><div class="scenario-buttons">${U.button('Danh sách','review-list',{icon:'file'})}${U.button('Tạo Popup','review-new',{icon:'plus'})}${U.button('Trải nghiệm Website','review-website',{icon:'monitor'})}</div></section>
      <section><h3>Vai trò và quyền truy cập</h3><div class="review-row"><label>Đang xem với vai trò<select id="review-role">${[...S.roles,'Nhân viên thu ngân'].map(x=>`<option ${x===S.data.role?'selected':''}>${x}</option>`).join('')}</select></label>${U.button('Áp dụng vai trò','apply-role',{class:'primary'})}</div><p style="margin-top:10px">Operator và Marketing chỉ thấy tab Popup. Các vai khác ngoài danh sách không được vào module.</p></section>
      <section><h3>Lịch và thay thế Popup</h3><p>Đồng hồ mô phỏng: <span class="review-clock">${U.date(S.data.clock)}</span> (UTC+7). Tiến đến 08/11 để thấy Popup theo lịch thay Popup đang chạy.</p><div class="review-row"><label>Tiến đến thời điểm<input type="datetime-local" id="review-time" value="2026-11-08T08:00"></label>${U.button('Chạy đến mốc này','advance-clock',{icon:'clock'})}</div></section>
      <section><h3>Trạng thái danh sách</h3><div class="scenario-buttons">${U.button('Có dữ liệu','scenario-normal')}${U.button('Trống','scenario-empty')}${U.button('Đang tải','scenario-loading')}${U.button('Lỗi kết nối','scenario-error')}</div></section>
      <section><h3>Lỗi ở lần lưu tiếp theo</h3><p>Mở một Popup để sửa, rồi chọn tình huống. Lỗi xuất hiện khi bấm lưu; nội dung đang nhập được giữ lại.</p><div class="scenario-buttons">${U.button('Không lưu được','fail-save')}${U.button('Xung đột cập nhật','fail-conflict')}${U.button('Thu hồi quyền','fail-permission')}</div></section>
      <section><h3>Điểm cần chốt với BA và kỹ thuật</h3><div class="review-note"><p>Các giá trị dưới đây là đề xuất để bấm thử, chưa phải quyết định nghiệp vụ:</p><ul><li>Khung nhìn hỗ trợ từ 1024 px; lịch dùng giờ Việt Nam.</li><li>Chặn lịch gỡ trước/bằng bắt đầu và lịch bắt đầu trùng chính xác. Vẫn cho phép khoảng lịch giao nhau.</li><li>Bản nháp cần ít nhất một nội dung; nhóm nội dung nhập tự do.</li><li>Ghi nhớ trên trình duyệt này; không mô phỏng đồng bộ tài khoản.</li></ul><p>Ưu tiên mini-BRD cập nhật: kiểm tra khung nhìn một lần tại mốc 1.000 ms, không theo dõi resize để đóng/mở bù. US 11.5 cần được đối chiếu lại.</p></div></section>
      <section><h3>Dữ liệu của bản thử</h3><p>Dữ liệu chỉ lưu cục bộ. Khôi phục sẽ đưa 7 Popup mẫu và đồng hồ về trạng thái ban đầu.</p>${U.button('Khôi phục dữ liệu mẫu','reset-demo',{icon:'refresh'})}</section>
    </div><div class="dialog-footer">${U.button('Đóng','close-dialog',{class:'primary'})}</div>`;d.showModal();
  }
  function closeCurrent(target){target.closest('dialog')?.close();}
  async function action(action,target){
    const id=target.dataset.id;U.hideMenu();
    switch(action){
      case 'new': location.hash='#new'; break;
      case 'edit': location.hash='#edit/'+id; break;
      case 'website': location.hash='#website';break;
      case 'filters': S.ui.filterOpen=!S.ui.filterOpen;U.list();break;
      case 'clear-filters': Object.assign(S.ui,{search:'',config:'all',display:'all',screenState:'normal'});U.list();break;
      case 'retry':S.ui.screenState='normal';U.list();U.toast('Đã tải lại danh sách.');break;
      case 'row-menu': U.rowMenu(id,target);break;
      case 'preview': W.preview(S.data.items.find(x=>x.id===id));break;
      case 'preview-form':W.preview(E.form);break;
      case 'publish-row': {
        const item=S.data.items.find(x=>x.id===id);const result=S.save(item,'publish',item.version);
        if(!result.ok){if(result.kind==='validation'){location.hash='#edit/'+id;U.toast('Bổ sung các trường bắt buộc trước khi xuất bản.',true);}else U.toast(result.message,true);}
        else {U.list();U.toast(result.replaced?`Đã xuất bản. “${result.replaced}” đã chuyển về Nháp.`:'Đã xuất bản Popup.');}break;
      }
      case 'schedule-row':pendingSchedule=true;location.hash='#edit/'+id;break;
      case 'draft-row': {const result=S.toDraft(id);if(result.ok){U.list();U.toast('Đã chuyển về Nháp. Popup ngừng hiển thị và lịch kích hoạt được hủy.');}else U.toast(result.message,true);break;}
      case 'save-editor':await E.save('save');break;
      case 'publish-editor':await E.save('publish');break;
      case 'draft-editor':await E.save('draft');break;
      case 'choose-image':E.chooseImage();break;
      case 'use-sample-image':E.setImage(S.image,'cham-soc-suc-khoe.webp');break;
      case 'remove-image':E.removeImage();break;
      case 'leave-editor':E.leave();break;
      case 'discard':E.discard();break;
      case 'compare':E.compare();break;
      case 'reload-editor':E.reload();break;
      case 'close-dialog':closeCurrent(target);break;
      case 'close-toast':document.querySelector('#toast-region').innerHTML='';break;
      case 'sidebar':S.ui.sidebar=!S.ui.sidebar;document.querySelector('.sidebar')?.classList.toggle('is-open',S.ui.sidebar);break;
      case 'review':review();break;
      case 'review-list':case 'review-new':case 'review-website':document.querySelector('#review-dialog').close();location.hash=action==='review-list'?'#list':action==='review-new'?'#new':'#website';break;
      case 'apply-role':S.setRole(document.querySelector('#review-role').value);document.querySelector('#review-dialog').close();if(E.form&&E.dirty()){E.render();}else if(location.hash==='#list'||!location.hash)U.list();else location.hash='#list';break;
      case 'advance-clock':{const r=S.advance(document.querySelector('#review-time').value);if(r.ok){document.querySelector('#review-dialog').close();if(location.hash.startsWith('#website'))W.render();else if(location.hash==='#list'||!location.hash)U.list();U.toast('Đã cập nhật lịch và trạng thái hiển thị.');}else U.toast(r.message,true);break;}
      case 'scenario-normal':case 'scenario-empty':case 'scenario-loading':case 'scenario-error':S.ui.screenState=action.replace('scenario-','');document.querySelector('#review-dialog').close();if(location.hash==='#list'||!location.hash)U.list();else location.hash='#list';break;
      case 'fail-save':case 'fail-conflict':S.ui.failure=action==='fail-save'?'save':'conflict';document.querySelector('#review-dialog').close();U.toast('Đã chọn lỗi cho lần lưu tiếp theo.');break;
      case 'fail-permission':S.ui.roleRevoked=true;document.querySelector('#review-dialog').close();U.toast('Quyền đã bị thu hồi trong bản thử. Thao tác lưu tiếp theo sẽ bị từ chối.');break;
      case 'reset-demo': {
        const d=document.querySelector('#confirm-dialog');d.innerHTML=`<div class="dialog-heading"><h2 id="confirm-title">Khôi phục dữ liệu mẫu?</h2></div><div class="dialog-body"><p>Các chỉnh sửa trong prototype sẽ được thay bằng 7 Popup mẫu. Dữ liệu CMS thật không bị ảnh hưởng.</p></div><div class="dialog-footer">${U.button('Giữ dữ liệu hiện tại','close-dialog')}${U.button('Khôi phục','confirm-reset',{class:'primary'})}</div>`;d.showModal();break;
      }
      case 'confirm-reset':S.reset();document.querySelectorAll('dialog[open]').forEach(d=>d.close());if(E.form)E.discard();S.ui.roleRevoked=false;location.hash='#list';U.list();U.toast('Đã khôi phục dữ liệu mẫu.');break;
      case 'visitor-close':if(target.closest('#live-preview'))break;W.closeVisitor();break;
      case 'visitor-cta':if(target.closest('#live-preview'))break;W.cta();break;
      case 'visitor-reload':W.render();break;
      case 'visitor-session':W.newSession();break;
      case 'visitor-new':W.newVisitor();break;
    }
  }
  document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){e.preventDefault();action(t.dataset.action,t);}});
  document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){S.ui.search=t.value;U.renderRows();}else if(t.closest('#popup-form'))E.input(t);});
  document.addEventListener('change',e=>{const t=e.target;if(t.id==='config-filter'){S.ui.config=t.value;U.renderRows();}else if(t.id==='display-filter'){S.ui.display=t.value;U.renderRows();}else if(t.id==='sort'){S.ui.order=t.value;U.renderRows();}else if(t.id==='image-upload')E.upload(t.files[0]);else if(t.id==='visitor-size')W.setSize(t.value);else if(t.id==='visitor-path')W.setPath(t.value);});
  document.addEventListener('submit',e=>{if(e.target.id==='popup-form'){e.preventDefault();E.save('save');}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ui.sidebar){S.ui.sidebar=false;document.querySelector('.sidebar')?.classList.remove('is-open');}});
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
  window.addEventListener('hashchange',route);
  window.addEventListener('beforeunload',e=>{if(E.dirty()){e.preventDefault();e.returnValue='';}});
  window.addEventListener('storage',e=>{if(e.key==='hiuh-popup-design-v1.0.0'){S.refresh();if(E.form&&(location.hash==='#new'||location.hash.startsWith('#edit/')))S.ui.failure='conflict';else if(location.hash.startsWith('#website'))W.render();else U.list();}});
  route();if(S.loadWarning)U.toast(S.loadWarning,true);
})();
</script>
